<html>
    <head>
        <title>Langchain Appointment Agent</title>
        <link rel="stylesheet" href="styles.css" />
        <script src="dist/app.js"></script>
    </head>
    <body>
        <div class="container">
            <section class="chat-window">
                <div class="chat-history">
                    <ul class="messages">
                        <li class="message message-user">Message #1</li>
                        <li class="message message-assistant">Message #2</li>
                        <li class="message message-user">Message #3</li>
                        <li class="message message-assistant">Message #4</li>
                    </ul>
                </div>
                <div>
                    <input class="chat-input" />
                    <button class="submit-button">Send</button>
                </div>
            </section>
            <section class="google-calendar">
                <iframe
                    src="https://calendar.google.com/calendar/embed?height=600&wkst=1&ctz=America%2FLos_Angeles&showPrint=0&src=YzJkNThlZjc4MjRhODZjNzg2YWE4MmRlZjlhZjNhN2IzZDFhNTQyNDUxMGQ4ZWIyY2IxZWI2ZWNkNjkwMTdjZEBncm91cC5jYWxlbmRhci5nb29nbGUuY29t&src=ZW4udXNhI2hvbGlkYXlAZ3JvdXAudi5jYWxlbmRhci5nb29nbGUuY29t&color=%23d50000&color=%233f51b5"
                    style="border: solid 1px #777"
                    width="1000"
                    height="800"
                    frameborder="0"
                    scrolling="no"
                ></iframe>
            </section>
            <!-- Section for Demo Control Panel -->
            <!--<section>
                <button>Reset Demo</button>
            </section>-->
        </div>
    </body>
</html>
